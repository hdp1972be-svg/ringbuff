name: Zynq offload benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Zynq benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Runner information
        run: |
          set -eux
          echo "runner: $RUNNER_NAME"
          echo "arch: $(uname -m)"
          echo "kernel: $(uname -sr)"
          echo "cpu model: $(lscpu | awk -F: '/Model name/ {gsub(/^ +/, \"\", $2); print $2; exit}')"
          echo "logical CPUs: $(nproc)"
          free -h
          lscpu

      - name: Configure and build
        run: |
          set -eux
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target zynq_cpu_host zynq_fpga_stub -j2

      - name: Run benchmark matrix
        run: |
          set -u
          mkdir -p benchmark-results/raw
          printf '%s\n' 'run\tmode\tpayload_bytes\tcompleted\trt_rate_sps\tlat_samples\tmin_us\tp10_us\tp50_us\tp90_us\tp99_us\tp99_9_us\tavg_us\tmax_us\tcompute_avg_us\thost_elapsed_s\thost_cpu_busy_pct\tload1_start\tload1_end\tload1_avg' > benchmark-results/results.tsv

          run_one() {
            run_no="$1"
            mode="$2"
            size="$3"
            prefix="benchmark-results/raw/run-${run_no}_${mode}_${size}"
            host_prefix=()
            stub_prefix=()
            case "$mode" in
              baseline) ;;
              pinned) host_prefix=(taskset -c 0); stub_prefix=(taskset -c 1) ;;
              fifo) host_prefix=(sudo -n chrt -f 80 taskset -c 0); stub_prefix=(taskset -c 1) ;;
            esac

            rm -f /dev/shm/zynq_offload || true
            "${stub_prefix[@]}" ./build/examples/zynq_fpga_stub -q > "$prefix.stub.log" 2>&1 &
            stub_pid=$!
            sleep 0.2
            set +e
            "${host_prefix[@]}" ./build/examples/zynq_cpu_host -s "$size" -z 256 -t 10 -L -R > "$prefix.log" 2>&1
            rc=$?
            set -e
            kill "$stub_pid" 2>/dev/null || true
            wait "$stub_pid" 2>/dev/null || true
            cat "$prefix.log"
            cat "$prefix.stub.log" || true
            if [ "$rc" -ne 0 ]; then return "$rc"; fi

            python3 - "$prefix.log" "$run_no" "$mode" "$size" >> benchmark-results/results.tsv <<'PY'
          import re, sys
          p, run_no, mode, size = sys.argv[1:]
          t = open(p, encoding='utf-8', errors='replace').read()
          def one(pat):
              m = re.search(pat, t, re.M)
              return m.group(1) if m else ''
          m = re.search(r'samples=(\d+)  min=([0-9.]+) us  p10=([0-9.]+) us  p50=([0-9.]+) us', t)
          ls, mn, p10, p50 = m.groups() if m else ('','','','')
          m = re.search(r'p90=([0-9.]+) us  p99=([0-9.]+) us  p99.9=([0-9.]+) us\navg=([0-9.]+) us  max=([0-9.]+) us', t)
          p90,p99,p999,avg,mx = m.groups() if m else ('','','','','')
          m = re.search(r'=== FPGA stub compute.*?samples=(\d+)  min=([0-9.]+) us  avg=([0-9.]+) us  max=([0-9.]+) us', t, re.S)
          ca = m.group(3) if m else ''
          m = re.search(r'load average: start ([0-9.]+)  end ([0-9.]+)', t)
          la,lb = m.groups() if m else ('','')
          print('\t'.join([run_no,mode,size,one(r'roundtrip done: completed=(\d+)'),one(r'serialized RTT rate=([0-9.]+)'),ls,mn,p10,p50,p90,p99,p999,avg,mx,ca,one(r'elapsed: ([0-9.]+) s'),one(r'aggregate CPU busy: ([0-9.]+)%'),la,lb,one(r'avg sampled 1m load: ([0-9.]+)')]))
PY
          }

          for mode in baseline pinned fifo; do
            for size in 64 256 1024 4096; do
              for run_no in 1 2 3; do
                run_one "$run_no" "$mode" "$size"
              done
            done
          done

          column -t -s $'\t' benchmark-results/results.tsv

      - name: Create JSON results
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          with Path('benchmark-results/results.tsv').open(newline='') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))
          Path('benchmark-results/results.json').write_text(json.dumps(rows, indent=2) + '\n')
PY

      - name: Publish summary
        if: always()
        run: |
          echo "Zynq benchmark results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmark-results/results.tsv ]; then column -t -s $'\t' benchmark-results/results.tsv >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zynq-benchmark-results
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 90
