name: Ringbuff benchmark matrix

on:
  schedule:
    - cron: '0 3 * * 0'      # weekly, Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install benchmark toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 linux-tools-common linux-tools-generic

      - name: Capture runner information
        run: |
          echo "=== GitHub Actions runner ==="
          echo "date_utc: $(date -u --iso-8601=seconds)"
          echo "runner_name: ${RUNNER_NAME}"
          echo "runner_os: ${RUNNER_OS}"
          echo "runner_arch: ${RUNNER_ARCH}"
          echo "runner_environment: ${RUNNER_ENVIRONMENT:-unknown}"
          echo "github_runner_image: ${ImageOS:-unknown}"
          echo
          echo "=== compiler ==="
          gcc-12 --version | head -1
          echo
          echo "=== system ==="
          uname -a
          echo "logical_cpus: $(nproc)"
          echo "cpu_model: $(grep -m1 'model name' /proc/cpuinfo | sed 's/^[^:]*:[[:space:]]*//')"
          echo "ram: $(free -h | awk '/^Mem:/ {print $2}')"
          echo
          echo "=== cpu flags ==="
          grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2- | xargs

      - name: Run benchmark matrix
        env:
          CC: gcc-12
          RB_BENCH_ITERS: 2000000
        run: |
          chmod +x ./run-bench.sh
          sudo env CC="$CC" RB_BENCH_ITERS="$RB_BENCH_ITERS" ./run-bench.sh

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: ringbuff-benchmark-${{ github.run_number }}
          path: bench-results/
          if-no-files-found: error
          retention-days: 90
